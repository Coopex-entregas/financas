<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escala rápida</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><style>body{background:#f4f6fb}.wrap{max-width:1500px}.card{border:0;border-radius:16px;box-shadow:0 5px 22px #0f172a10}.table input,.table select{min-width:120px}.wide{min-width:180px!important}.saving{opacity:.55}.sticky-head thead{position:sticky;top:104px;background:#fff;z-index:3}</style></head><body><main class="container-fluid wrap py-3"><div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><div><h4 class="mb-0">Escala rápida</h4><small class="text-secondary">{{ total }} linha(s). Edite, salve ou exclua sem abrir modais.</small></div><button id="deleteSelected" class="btn btn-outline-danger"><i class="bi bi-trash"></i> Excluir selecionadas</button></div>
<form method="get" class="card card-body mb-3"><div class="row g-2"><div class="col-lg-5"><input class="form-control" name="q" value="{{ request.args.get('q','') }}" placeholder="Buscar data, turno, horário, contrato ou nome"></div><div class="col-lg-3"><select class="form-select" name="restaurante_id"><option value="">Todos os estabelecimentos</option>{% for r in restaurantes %}<option value="{{ r.id }}" {{ 'selected' if request.args.get('restaurante_id')|int==r.id }}>{{ r.nome }}</option>{% endfor %}</select></div><div class="col-lg-3"><select class="form-select" name="cooperado_id"><option value="">Todos os cooperados</option>{% for c in cooperados %}<option value="{{ c.id }}" {{ 'selected' if request.args.get('cooperado_id')|int==c.id }}>{{ c.nome }}</option>{% endfor %}</select></div><div class="col-lg-1 d-grid"><button class="btn btn-primary">Filtrar</button></div></div></form>
<div class="card"><div class="table-responsive" style="max-height:72vh"><table class="table table-hover align-middle mb-0 sticky-head"><thead><tr><th><input id="checkAll" type="checkbox"></th><th>ID</th><th>Data</th><th>Turno</th><th>Horário</th><th>Contrato</th><th>Cooperado</th><th>Estabelecimento</th><th>Nome livre</th><th>Ações</th></tr></thead><tbody>
{% for e in rows %}<tr data-id="{{ e.id }}"><td><input class="row-check" type="checkbox" value="{{ e.id }}"></td><td>#{{ e.id }}</td><td><input class="form-control form-control-sm" data-field="data" value="{{ e.data or '' }}"></td><td><input class="form-control form-control-sm" data-field="turno" value="{{ e.turno or '' }}"></td><td><input class="form-control form-control-sm wide" data-field="horario" value="{{ e.horario or '' }}"></td><td><input class="form-control form-control-sm wide" data-field="contrato" value="{{ e.contrato or '' }}"></td><td><select class="form-select form-select-sm wide" data-field="cooperado_id"><option value="">Sem cadastro</option>{% for c in cooperados %}<option value="{{ c.id }}" {{ 'selected' if c.id==e.cooperado_id }}>{{ c.nome }}</option>{% endfor %}</select></td><td><select class="form-select form-select-sm wide" data-field="restaurante_id"><option value="">Não vinculado</option>{% for r in restaurantes %}<option value="{{ r.id }}" {{ 'selected' if r.id==e.restaurante_id }}>{{ r.nome }}</option>{% endfor %}</select></td><td><input class="form-control form-control-sm" data-field="cooperado_nome" value="{{ e.cooperado_nome or '' }}"></td><td class="text-nowrap"><button class="btn btn-sm btn-success save"><i class="bi bi-check2"></i></button> <button class="btn btn-sm btn-outline-danger delete"><i class="bi bi-trash"></i></button></td></tr>{% else %}<tr><td colspan="10" class="text-center py-5 text-secondary">Nenhuma escala encontrada.</td></tr>{% endfor %}</tbody></table></div></div>
<nav class="mt-3"><ul class="pagination justify-content-center"><li class="page-item {{ 'disabled' if page<=1 }}"><a class="page-link" href="?page={{ page-1 }}&q={{ request.args.get('q','')|urlencode }}&restaurante_id={{ request.args.get('restaurante_id','') }}&cooperado_id={{ request.args.get('cooperado_id','') }}">Anterior</a></li><li class="page-item disabled"><span class="page-link">{{ page }} de {{ pages }}</span></li><li class="page-item {{ 'disabled' if page>=pages }}"><a class="page-link" href="?page={{ page+1 }}&q={{ request.args.get('q','')|urlencode }}&restaurante_id={{ request.args.get('restaurante_id','') }}&cooperado_id={{ request.args.get('cooperado_id','') }}">Próxima</a></li></ul></nav></main>
<script>function payload(row){const o={};row.querySelectorAll('[data-field]').forEach(e=>o[e.dataset.field]=e.value);return o}document.addEventListener('click',async e=>{const row=e.target.closest('tr[data-id]');if(!row)return;const id=row.dataset.id;if(e.target.closest('.save')){row.classList.add('saving');const r=await fetch('/api/admin/escalas/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload(row))});const x=await r.json();row.classList.remove('saving');x.ok?coopexToast('Escala salva'):alert(x.error||'Erro')}if(e.target.closest('.delete')){if(!confirm('Excluir esta linha da escala?'))return;const r=await fetch('/api/admin/escalas/'+id,{method:'DELETE'}),x=await r.json();if(x.ok){row.remove();coopexToast('Escala excluída')}else alert(x.error||'Erro')}});document.getElementById('checkAll').onchange=e=>document.querySelectorAll('.row-check').forEach(c=>c.checked=e.target.checked);document.getElementById('deleteSelected').onclick=async()=>{const ids=[...document.querySelectorAll('.row-check:checked')].map(x=>x.value);if(!ids.length)return alert('Selecione ao menos uma linha.');if(!confirm('Excluir '+ids.length+' linha(s)?'))return;const r=await fetch('/api/admin/escalas',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})}),x=await r.json();if(x.ok){ids.forEach(id=>document.querySelector('tr[data-id="'+id+'"]')?.remove());coopexToast(x.deleted+' excluída(s)')}else alert(x.error||'Erro')};</script></body></html>
